<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Legal RAG{% endblock %}</title>
  <style>
    :root { color-scheme: light; --ink:#182025; --muted:#69747b; --paper:#f6f3ec; --card:#fff; --accent:#174f46; --danger:#8a2f2f; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif; color:var(--ink); background:var(--paper); }
    header { background:#102e2a; color:white; padding:18px max(24px,calc((100vw - 1100px)/2)); display:flex; justify-content:space-between; align-items:center; }
    header a { color:white; text-decoration:none; }
    main { max-width:1100px; margin:28px auto; padding:0 24px 60px; }
    h1,h2,h3 { line-height:1.2; }
    .card { background:var(--card); border:1px solid #dedbd3; border-radius:10px; padding:20px; margin:16px 0; box-shadow:0 2px 10px #0000000b; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
    input,select,button { font:inherit; padding:9px 11px; border-radius:6px; border:1px solid #b8b8b0; }
    button { background:var(--accent); color:white; border-color:var(--accent); cursor:pointer; }
    button.secondary { background:white; color:var(--ink); border-color:#999; }
    button.danger { background:var(--danger); border-color:var(--danger); }
    form.inline { display:inline-flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .muted { color:var(--muted); }
    .status { display:inline-block; padding:2px 8px; border-radius:999px; background:#e8ecea; font-size:12px; }
    .status.ready { background:#d9efe5; }.status.failed { background:#f4dede; }.status.processing,.status.queued,.status.uploaded { background:#f4ead1; }
    .flash { padding:12px 16px; border-radius:7px; background:#e4efe9; }.flash.error { background:#f4dede; }
    table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:10px; border-bottom:1px solid #e3e0d9; vertical-align:top; }
    code { overflow-wrap:anywhere; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; }
  </style>
</head>
<body>
<header><a href="/admin"><strong>Legal Case File RAG</strong></a>{% if request.session.get('admin') %}<form method="post" action="/admin/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="secondary">Log out</button></form>{% endif %}</header>
<main>
  {% if flash %}<p class="flash {{ flash.level }}">{{ flash.message }}</p>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
